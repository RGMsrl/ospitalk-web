<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ospitalk, assistente WhatsApp per l'ospitalità</title>
  <desc id="desc">Grafica color crema e terracotta con il marchio Ospitalk e una conversazione stilizzata.</desc>
  <rect width="1200" height="630" fill="#FBF5EC"/>
  <circle cx="1090" cy="40" r="250" fill="#F3E8D7"/>
