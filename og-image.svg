<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ospitalk, assistente WhatsApp per l'ospitalità</title>
  <desc id="desc">Grafica color carta con il marchio Ospitalk, una targhetta QR appesa e il percorso di una domanda: risposta automatica in lingua e passaggio all'host.</desc>
  <rect width="1200" height="630" fill="#F6F0E4"/>
  <g transform="translate(66 56) scale(0.36)"><circle cx="50" cy="19" r="13" fill="none" stroke="#9A7A3F" stroke-width="9"/><path d="M50 33C27 33 15 48 15 72c0 23 14 37 30 40l27 16-8-21c13-7 21-19 21-35 0-24-12-39-35-39z" fill="#1F5A45"/><circle cx="50" cy="65" r="10" fill="#E3B54C"/><path d="M44.5 69h11l2.5 23h-16z" fill="#E3B54C"/></g>
  <text x="110" y="98" font-family="Newsreader, Georgia, serif" font-size="40" font-weight="600" fill="#1B2420">Ospitalk</text>
  <text x="72" y="228" font-family="Newsreader, Georgia, serif" font-size="68" font-weight="600" fill="#1B2420">Gli ospiti chiedono.</text>
  <text x="72" y="301.44" font-family="Newsreader, Georgia, serif" font-size="68" font-style="italic" font-weight="500" fill="#8E3A22">La tua casa risponde.</text>
  <text x="72" y="378" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="28" fill="#4A524C">L'assistente WhatsApp per case vacanza,</text>
  <text x="72" y="416" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="28" fill="#4A524C">B&amp;B e affittacamere.</text>
  <path d="M72 474H640" stroke="#B9B3A6" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="72" y="524" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="25" font-weight="700" fill="#1F5A45">Nessuna app · Nessuna carta · Dal tuo WhatsApp</text>
  <rect x="736" y="204" width="404" height="374" rx="14" fill="#1F5A45"/>
  <rect x="728" y="196" width="404" height="374" rx="14" fill="#FFFDF8" stroke="#1B2420" stroke-width="1.5"/>
  <path d="M760 274V518" stroke="#A8462A" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="784" y="256" width="300" height="46" rx="12" fill="#F6F0E4" stroke="#1B2420" stroke-width="1.5"/>
  <circle cx="760" cy="274" r="6" fill="#FFFDF8" stroke="#A8462A" stroke-width="2.4"/>
  <text x="800" y="286" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="21" fill="#1B2420">What's the Wi-Fi password?</text>
  <rect x="806" y="318" width="304" height="46" rx="12" fill="#1F5A45"/>
  <circle cx="760" cy="336" r="6" fill="#FFFDF8" stroke="#A8462A" stroke-width="2.4"/>
  <text x="822" y="348" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="21" fill="#FFFFFF">Network “CasaLimoni”. Enjoy!</text>
  <g transform="translate(1040 368) rotate(-5)"><rect x="-92.2" y="-14.0" width="184.5" height="28" rx="5" fill="#FFFDF8" stroke="#8E3A22" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#8E3A22">RISPOSTA INVIATA</text></g>
  <rect x="784" y="404" width="236" height="42" rx="21" fill="none" stroke="#A8462A" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="760" cy="425" r="6" fill="#FFFDF8" stroke="#A8462A" stroke-width="2.4"/>
  <text x="804" y="433" font-family="Newsreader, Georgia, serif" font-size="23" font-style="italic" font-weight="500" fill="#8E3A22">Chiedo all'host…</text>
  <rect x="806" y="464" width="304" height="46" rx="12" fill="#DCE8DE" stroke="#1F5A45" stroke-width="1.5"/>
  <circle cx="760" cy="500" r="6" fill="#FFFDF8" stroke="#A8462A" stroke-width="2.4"/>
  <text x="822" y="494" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="21" fill="#1B2420">Sì, dalle 10 al ripostiglio.</text>
  <g transform="translate(1070 518) rotate(-5)"><rect x="-48.0" y="-14.0" width="96.1" height="28" rx="5" fill="#FFFDF8" stroke="#1F5A45" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#1F5A45">SALVATA</text></g>
